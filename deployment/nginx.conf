# /etc/nginx/sites-available/xkale-inventory
# Enlazar con: ln -s /etc/nginx/sites-available/xkale-inventory /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name xkale.inventory;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name xkale.inventory;

    ssl_certificate     /etc/nginx/ssl/xkale.inventory.crt;
    ssl_certificate_key /etc/nginx/ssl/xkale.inventory.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root  /var/www/xkale-inventory;
    index index.html;

    # Proxy hacia la API de FastAPI
    location ~ ^/(auth|usuarios|tecnicos|laptops|tickets|consultas)(/|$) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: todas las rutas del frontend van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeceras de seguridad básicas
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin" always;
}
