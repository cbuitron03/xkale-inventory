# /etc/nginx/sites-available/xkale-inventory
# Enlazar con: ln -s /etc/nginx/sites-available/xkale-inventory /etc/nginx/sites-enabled/
#
# default_server: responde también cuando se entra por la IP del servidor.

server {
    listen 80 default_server;
    server_name xkale.inventory _;

    # Descarga de la CA interna por HTTP, para instalarla antes de confiar en el HTTPS
    location = /xkale-ca.crt {
        alias /etc/nginx/ssl/xkale-ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name xkale.inventory _;

    ssl_certificate     /etc/nginx/ssl/xkale.inventory.crt;
    ssl_certificate_key /etc/nginx/ssl/xkale.inventory.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root  /var/www/xkale-inventory;
    index index.html;

    # API FastAPI bajo /api. La barra final de proxy_pass quita el prefijo:
    # /api/laptops/ -> http://127.0.0.1:8000/laptops/ (uvicorn corre con --root-path /api)
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos generados por Vite: llevan hash en el nombre, se pueden cachear
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: todas las rutas del frontend van a index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Cabeceras de seguridad básicas
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin" always;
}
